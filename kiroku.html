<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廻珠記録帳</title>
<link rel="stylesheet" href="kiroku.css">
</head>
<body>
    <header>
        <h1>廻珠記録帳</h1> 
        <a href="index.html">ホームへ戻る</a>
    </header>
    <main>
<form id="kiroku-form">
 <label>
 日付
 <input type="date" name="date" required>
</label>
<label>
 廻珠数
 <input type="number" name="count" min="0" required>
</label>
<label>
 備考
 <textarea name="notes"></textarea>
</label>
<button type="submit" id="submit-button">記録する</button>
<button type="button" id="cancel-edit-button" hidden>編集をキャンセル</button>
</form>
<section id="stats-section">
 <h2>集計</h2>
 <p id="total-count"></p>
 <p id="pull-estimate"></p>
 <svg id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="累計廻珠数の推移グラフ"></svg>
</section>
<section>
 <h2>記録一覧</h2>
 <div class="data-actions">
  <button type="button" id="export-button">エクスポート</button>
  <label class="file-button">
   インポート
   <input type="file" id="import-input" accept="application/json" hidden>
  </label>
 </div>
<div id="record-list">

</div>
</section>
</main>
<script src="kiroku.js"></script>
</body>
</html>
